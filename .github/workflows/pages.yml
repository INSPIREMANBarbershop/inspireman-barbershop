name: Preparar o publicar GitHub Pages
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar con autorización del propietario
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/check.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: ${{ inputs.publicar == true }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
